
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Weather Widget</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;

      background: rgba(255, 255, 255, 0);

          font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;
      
    }

    .weather-widget {
      width: 340px;
      height: 220px;

      padding: 28px 30px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;

      
      background:
          linear-gradient(
              135deg,
              rgba(35, 35, 35, 0.98) 0%,
              rgba(15, 15, 17, 0.98) 100%
          );

      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);

      color: rgba(255, 255, 255, 0.96);

      /* Принципиально без тени */
      box-shadow: none;
    }

    .weather-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .location {
      letter-spacing: 1.4px;
      font-weight: 600;
      font-size: 13px;
      color: #939398;
    }

    .description {
      margin-top: 3px;

      font-size: 18px;
      font-weight: 600;
    }

    .refresh {
      width: 28px;
      height: 28px;

      display: grid;
      place-items: center;

      border: 0;
      border-radius: 50%;

      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);

      font-size: 17px;
      cursor: pointer;

      box-shadow: none;
    }

    .refresh:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: -6px;
    }

    .temperature {
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -4px;
    }

    .weather-symbol {
      font-size: 58px;
      line-height: 1;
    }

    .weather-footer {
      display: flex;
      gap: 12px;

      padding-top: 12px;

      border-top: 1px solid rgba(255, 255, 255, 0.1);

      font-size: 14px;
      color: rgba(255, 255, 255, 0.62);

      white-space: nowrap;
    }

    .loading,
    .error {
      height: 100%;

      display: grid;
      place-items: center;

      font-size: 14px;
      color: rgba(255, 255, 255, 0.65);
    }

    .error {
      color: #ff8a8a;
    }
  </style>
</head>

<body>

  <div class="weather-widget" id="weather-widget">

    <div class="weather-header">
      <div>
        <div class="location" id="location">
            ПОГОДА
        </div>

        <div class="description" id="description">
          Получаем данные о погоде
        </div>
      </div>

      <!--<button
        class="refresh"
        id="refresh"
        title="Обновить"
      >
        ↻
      </button>-->
    </div>

    <div class="weather-main">
      <div class="temperature" id="temperature">
        --
      </div>

      <div class="weather-symbol" id="weather-symbol">
        ☀️
      </div>
    </div>

    <div class="weather-footer">
      <span id="feels-like">
        Ощущается: --
      </span>

      <span id="humidity">
        💧 --%
      </span>

      <span id="wind">
        ↗ -- м/с
      </span>
    </div>

  </div>
  
  <script src="../../../_libraries/error_handler.js"></script>
  <script src="../../../_libraries/tauri.js"></script>

  <script type="module">
    const config = await tauri.getSettings();
    const LATITUDE = config.latitude;
    const LONGITUDE = config.longitude;
    console.log(config)

    const elements = {
      location: document.getElementById("location"),
      description: document.getElementById("description"),
      temperature: document.getElementById("temperature"),
      symbol: document.getElementById("weather-symbol"),
      feelsLike: document.getElementById("feels-like"),
      humidity: document.getElementById("humidity"),
      wind: document.getElementById("wind"),
      refresh: document.getElementById("refresh")
    };

    function getWeatherInfo(code) {

      const weatherCodes = {
        0:  ["Ясно", "☀️"],
        1:  ["Преимущественно ясно", "🌤️"],
        2:  ["Переменная облачность", "⛅"],
        3:  ["Облачно", "☁️"],

        45: ["Туман", "🌫️"],
        48: ["Изморозь", "🌫️"],

        51: ["Слабая морось", "🌦️"],
        53: ["Морось", "🌦️"],
        55: ["Сильная морось", "🌧️"],

        61: ["Небольшой дождь", "🌦️"],
        63: ["Дождь", "🌧️"],
        65: ["Сильный дождь", "🌧️"],

        71: ["Небольшой снег", "🌨️"],
        73: ["Снег", "❄️"],
        75: ["Сильный снег", "❄️"],

        80: ["Ливень", "🌦️"],
        81: ["Сильный ливень", "🌧️"],
        82: ["Очень сильный ливень", "⛈️"],

        95: ["Гроза", "⛈️"],
        96: ["Гроза с градом", "⛈️"],
        99: ["Сильная гроза с градом", "⛈️"]
      };

      return weatherCodes[code] || ["Неизвестно", "🌡️"];
    }


    async function loadWeather() {
      try {
        elements.description.textContent =
          "Обновление...";

        const url =
          "https://api.open-meteo.com/v1/forecast" +
          `?latitude=${LATITUDE}` +
          `&longitude=${LONGITUDE}` +
          "&current=" +
          "temperature_2m," +
          "relative_humidity_2m," +
          "apparent_temperature," +
          "weather_code," +
          "wind_speed_10m" +
          "&wind_speed_unit=ms";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `Ошибка HTTP: ${response.status}`
          );
        }

        const data = await response.json();

        const current = data.current;

        const [description, symbol] =
          getWeatherInfo(current.weather_code);

        elements.description.textContent =
          description;

        elements.temperature.textContent =
          `${Math.round(current.temperature_2m)}°`;

        elements.symbol.textContent =
          symbol;

        elements.feelsLike.textContent =
          `Ощущается как ${
            Math.round(current.apparent_temperature)
          }°`;

        elements.humidity.textContent =
          `💧 ${current.relative_humidity_2m}%`;

        elements.wind.textContent =
          `↗ ${current.wind_speed_10m} м/с`;

      } catch (error) {

        console.error(error);

        elements.location.textContent =
          "Ошибка";

        elements.description.textContent =
          "Не удалось загрузить погоду";

        elements.temperature.textContent =
          "--";

        elements.symbol.textContent =
          "⚠️";
      }
    }

    if (elements.refresh) {
      elements.refresh.addEventListener(
        "click",
        loadWeather
      );
    }
    
    loadWeather();

    setInterval(
      loadWeather,
      // every 10 minutes
      10 * 60 * 1000
    );

  </script>

</body>
</html>
