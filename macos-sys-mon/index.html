<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>System Monitor</title>

        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                min-height: 100%;
                overflow: hidden;
                background: transparent;
            }

            body {
                display: grid;
                place-items: center;
                min-height: 100vh;

                background: rgba(255, 255, 255, 0);

                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            .system-widget {
                width: 340px;
                height: 220px;

                padding: 28px 30px;

                display: flex;
                flex-direction: column;
                justify-content: space-between;

                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 32px;

                background: linear-gradient(
                    135deg,
                    rgba(35, 35, 35, 0.98) 0%,
                    rgba(15, 15, 17, 0.98) 100%
                );

                backdrop-filter: blur(28px);
                -webkit-backdrop-filter: blur(28px);

                color: rgba(255, 255, 255, 0.96);

                /* Никакой тени */
                box-shadow: none;
            }

            .widget-title {
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 1.4px;

                color: #939398;
            }

            .metrics {
                display: flex;
                align-items: center;
                justify-content: space-between;

                gap: 24px;
            }

            .metric {
                flex: 1;
                min-width: 0;
            }

            .metric-label {
                margin-bottom: 5px;

                font-size: 13px;
                font-weight: 600;
                letter-spacing: 1px;

                color: #939398;
            }

            .metric-value {
                font-size: 42px;
                font-weight: 800;
                line-height: 1;

                letter-spacing: -2.5px;

                color: rgba(255, 255, 255, 0.96);
            }

            .metric-unit {
                margin-left: 2px;

                font-size: 20px;
                font-weight: 600;

                color: rgba(255, 255, 255, 0.45);
            }

            .ram-details {
                margin-top: 7px;

                font-size: 12px;

                color: rgba(255, 255, 255, 0.45);

                white-space: nowrap;
            }

            .divider {
                width: 1px;
                height: 70px;

                background: rgba(255, 255, 255, 0.1);
            }

            .widget-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;

                padding-top: 12px;

                border-top: 1px solid rgba(255, 255, 255, 0.1);

                font-size: 12px;

                color: rgba(255, 255, 255, 0.5);
            }

            .status {
                display: flex;
                align-items: center;
                gap: 7px;
            }

            .status-dot {
                width: 6px;
                height: 6px;

                border-radius: 50%;

                background: #5ee28b;

                box-shadow: none;
            }

            .updated {
                color: rgba(255, 255, 255, 0.35);
            }
        </style>
    </head>

    <body>
        <div class="system-widget">
            <div class="widget-title">SYSTEM</div>

            <div class="metrics">
                <div class="metric">
                    <div class="metric-label">CPU</div>

                    <div class="metric-value">
                        <span id="cpu-value">--</span>
                        <span class="metric-unit">%</span>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="metric">
                    <div class="metric-label">RAM</div>

                    <div class="metric-value">
                        <span id="ram-value">--</span>
                        <span class="metric-unit">%</span>
                    </div>

                    <div class="ram-details" id="ram-details">-- / -- GB</div>
                </div>
            </div>

            <div class="widget-footer">
                <div class="status">
                    <div class="status-dot"></div>

                    <span> Monitoring </span>
                </div>

                <span class="updated" id="updated"> -- </span>
            </div>
        </div>

        <script src="../../../_libraries/error_handler.js"></script>
        <script src="../../../_libraries/tauri.js"></script>
        <script type="module">
            document.addEventListener("DOMContentLoaded", async () => {
                const cpuValue = document.getElementById("cpu-value");

                const ramValue = document.getElementById("ram-value");

                const ramDetails = document.getElementById("ram-details");

                const updated = document.getElementById("updated");

                async function updateMetrics() {
                    try {
                        const {
                            cpu_usage,
                            ram_usage,
                            ram_used_gb,
                            ram_total_gb,
                        } = await tauri.invoke("get_system_metrics");

                        cpuValue.textContent = cpu_usage.toFixed(1);

                        ramValue.textContent = ram_usage.toFixed(1);

                        ramDetails.textContent =
                            `${ram_used_gb.toFixed(1)} / ` +
                            `${ram_total_gb.toFixed(1)} GB`;

                        updated.textContent = new Date().toLocaleTimeString(
                            "en-US",
                            {
                                hour: "2-digit",
                                minute: "2-digit",
                                second: "2-digit",
                            },
                        );
                    } catch (error) {
                        console.error(error);

                        cpuValue.textContent = "--";
                        ramValue.textContent = "--";
                        ramDetails.textContent = "Нет данных";
                    }
                }

                updateMetrics();

                setInterval(updateMetrics, 1000);
            });
        </script>
    </body>
</html>
